name: HubTech Sovereign Security & Unit Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime & audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest requests "PyJWT[crypto]" bandit pip-audit defusedxml ddgs

      - name: Sovereign Security Invariants (Zero eval/exec/shell=True/pickle)
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          banned_calls = {"eval", "exec"}
          violations = []

          for py in pathlib.Path("cred_hub").rglob("*.py"):
              if "tests" in py.parts:
                  continue
              src = py.read_text(encoding="utf-8")
              tree = ast.parse(src, filename=str(py))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name) and node.func.id in banned_calls:
                          violations.append(f"{py}:{node.lineno}: forbidden {node.func.id}()")
                      if isinstance(node.func, ast.Attribute) and node.func.attr == "loads":
                          if isinstance(node.func.value, ast.Name) and node.func.value.id == "pickle":
                              violations.append(f"{py}:{node.lineno}: forbidden pickle.loads()")
                      for kw in node.keywords:
                          if kw.arg == "shell" and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              violations.append(f"{py}:{node.lineno}: forbidden subprocess shell=True")

          if violations:
              print("\n".join(violations), file=sys.stderr)
              sys.exit(1)
          print("All sovereign AST security invariants passed.")
          PY

      - name: Bandit SAST (Medium/High Severity, High Confidence)
        run: |
          bandit -r cred_hub -x cred_hub/tests -ll -iii

      - name: PyPI Dependency Vulnerability Scan (pip-audit)
        run: |
          # Audit direct runtime dependencies of cred-hub
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install -q requests "PyJWT[crypto]" ddgs defusedxml
          /tmp/audit-venv/bin/pip install -q pip-audit
          /tmp/audit-venv/bin/pip-audit --desc

      - name: Run Pure Unit Tests (S3 Storage, Healthcheck, CNPJ, ERP)
        run: |
          PYTHONPATH=. pytest -q \
            cred_hub/tests/test_s3_storage.py \
            cred_hub/tests/test_healthcheck.py \
            cred_hub/tests/test_cnpj_mapping.py \
            cred_hub/tests/test_erp_clients.py \
            cred_hub/tests/test_erp_mapper.py
