[project]
name = "cred_hub"
authors = [{ name = "CredTech Digital", email = "eduardo_dallabrida@credtechdigital.com.br" }]
description = "Cred Hub: customizações da CredTech para o Frappe CRM (enriquecimento por CNPJ, marca, integrações)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
dynamic = ["version"]
dependencies = ["ddgs>=9.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
